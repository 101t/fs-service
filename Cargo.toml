[package]
name = "fs-service"
version = "2.0.1"
edition = "2024"
rust-version = "1.85"
description = "A fast, secure REST gateway for FreeSWITCH: SIP gateways, fax & voice broadcast, and a built-in CDR logger."
license = "MIT"
repository = "https://github.com/101t/fs-service"
keywords = ["freeswitch", "esl", "fax", "cdr", "voip"]
categories = ["web-programming::http-server", "network-programming"]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6", features = ["derive", "env"] }
quick-xml = "0.42"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "chrono", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "process", "signal", "sync", "time"] }
tower-http = { version = "0.7", features = ["trace", "timeout", "sensitive-headers", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "6", features = ["axum_extras", "chrono", "uuid"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
uuid = { version = "1.29", features = ["v7", "serde"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
