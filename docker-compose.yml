# FreeSWITCH + fs-service on one host.
#
#   cp .env.example .env            # set FSS_API_TOKENS and FSS_ESL_PASSWORD
#   docker compose up -d            # add --build to build from source
#   open http://localhost:8080/docs
#
# Both containers use host networking: SIP and RTP media need real ports, and the event
# socket stays on 127.0.0.1. Volumes are mounted at the same paths in both containers, so
# a file uploaded to fs-service is exactly where txfax/playback look for it.
services:
  fs-service:
    # Released image; pin a version with FSS_VERSION=2.0.0. `--build` builds from source instead.
    image: ghcr.io/101t/fs-service:${FSS_VERSION:-latest}
    build: .
    env_file: .env
    environment:
      FSS_ESL_ADDR: 127.0.0.1:8021
    network_mode: host
    volumes:
      - fss-data:/var/lib/fs-service
      - fss-gateways:/etc/freeswitch/sip_profiles/external
    restart: unless-stopped

  freeswitch:
    image: safarov/freeswitch:latest
    network_mode: host
    # Start after fs-service so the shared volumes are created with fs-service's ownership.
    depends_on: [fs-service]
    environment:
      # Read by contrib/freeswitch/autoload_configs/event_socket.conf.xml. Required: an empty
      # password would make FreeSWITCH fall back to the stock "ClueCon".
      FSS_ESL_PASSWORD: ${FSS_ESL_PASSWORD:?set FSS_ESL_PASSWORD in .env}
    # The image's own healthcheck runs fs_cli with the default password, which we replaced.
    healthcheck:
      test: ["CMD-SHELL", "fs_cli -p \"$$FSS_ESL_PASSWORD\" -x status | grep -q ^UP"]
      interval: 15s
      timeout: 5s
      start_period: 20s
    volumes:
      - fss-data:/var/lib/fs-service
      - fss-gateways:/etc/freeswitch/sip_profiles/external
      - ./contrib/freeswitch/autoload_configs/event_socket.conf.xml:/etc/freeswitch/autoload_configs/event_socket.conf.xml:ro
      - ./contrib/freeswitch/dialplan/public/50_fax_inbound.xml:/etc/freeswitch/dialplan/public/50_fax_inbound.xml:ro
    restart: unless-stopped

volumes:
  fss-data: {}
  fss-gateways: {}
